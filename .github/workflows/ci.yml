name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Install browser for headless checks
        working-directory: frontend
        run: npx --no-install playwright install chromium

      - name: Build frontend, portable app and installer
        run: ./tools/build.ps1

      - name: Check core persistence
        run: dotnet run --project tests/QuanShuo.Core.Tests -c Release

      # These tests use synthetic WAVs and a localhost fixture. Native controls
      # are created without focus-taking windows; the app runs only its smoke CLI.
      - name: Check local ASR protocol, saving and model switching
        run: |
          $env:QUANSHUO_TEST_EXE = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/portable/QuanShuo.exe'
          dotnet run --project tests/QuanShuo.LocalAsr.Tests -c Release

      - name: Check local ASR settings and prompts
        run: npm --prefix frontend run test:local-asr

      - name: Check delayed settings responses
        run: npm --prefix frontend run test:local-asr-races

      - name: Check editor and history races in both skins
        run: |
          foreach ($skin in @('starlake', 'crabapple')) {
            $env:QS_SKIN = $skin
            node frontend/scripts/test-races.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify packaged files against source and build
        run: dotnet run --project tests/QuanShuo.Core.Tests -c Release --no-build -- verify-delivery

      # Recording.Tests needs an interactive desktop and sends real keys.
      # Run it manually before releases; never substitute CI for those checks.
      - name: Keep verified review builds for seven days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quanshuo-windows-${{ github.sha }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            artifacts/publish/portable/QuanShuo.exe
            artifacts/package/QuanShuo-portable.zip
            artifacts/package/SHA256SUMS.txt
            artifacts/installer/QuanShuo-Setup.exe
